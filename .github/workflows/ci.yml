name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpu-safe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.7.0+cpu" "torchvision==0.22.0+cpu"
          python -m pip install --editable ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run CPU-safe tests
        run: python -m pytest tests/test_contracts.py tests/test_scene_analysis.py

      - name: Compile Python modules
        run: python -m compileall -q app core pipeline providers scripts tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
